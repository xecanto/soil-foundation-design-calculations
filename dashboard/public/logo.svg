<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 190" width="100%" role="img" aria-labelledby="geofoundTitle geofoundDesc">
  <title id="geofoundTitle">Geofound</title>
  <desc id="geofoundDesc">Geofound logo with the tagline Precision beneath the surface.</desc>
  <defs>
    <linearGradient id="geoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A365D" />
      <stop offset="100%" stop-color="#2B6CB0" />
    </linearGradient>
    <linearGradient id="foundGrad" x1="0%" y1="0%" x2="100%" y2="100%">
